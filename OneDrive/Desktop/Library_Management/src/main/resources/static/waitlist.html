<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Waitlist</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav>
  <h1>📚 Smart Library System</h1>
  <div class="nav-links">
    <a href="index.html">Dashboard</a>
    <a href="books.html">Books</a>
    <a href="members.html">Members</a>
    <a href="transactions.html">Issue / Return</a>
    <a href="waitlist.html" class="active">Waitlist</a>
  </div>
</nav>
<main>
  <h2>Join Waitlist</h2>
  <p class="hint">Use this only when a book has 0 available copies. You'll automatically be issued the book once it's returned.</p>
  <div id="message" class="message" style="display:none;"></div>
  <form id="reservationForm" class="card-form">
    <select id="bookSelect" required></select>
    <select id="memberSelect" required></select>
    <button type="submit">Join Waitlist</button>
  </form>
  <h2>Active Waitlist</h2>
  <table id="waitlistTable">
    <thead><tr><th>Book</th><th>Member</th><th>Reserved On</th><th>Action</th></tr></thead>
    <tbody id="waitlistBody"></tbody>
  </table>
</main>
<script src="/js/common.js"></script>
<script src="/js/waitlist.js"></script>
</body>
</html>
