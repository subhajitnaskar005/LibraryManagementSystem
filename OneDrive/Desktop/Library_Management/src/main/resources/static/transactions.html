<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Issue / Return</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav>
  <h1>📚 Smart Library System</h1>
  <div class="nav-links">
    <a href="index.html">Dashboard</a>
    <a href="books.html">Books</a>
    <a href="members.html">Members</a>
    <a href="transactions.html" class="active">Issue / Return</a>
    <a href="waitlist.html">Waitlist</a>
  </div>
</nav>
<main>
  <h2>Issue a Book</h2>
  <div id="message" class="message" style="display:none;"></div>
  <form id="issueForm" class="card-form">
    <select id="bookSelect" required></select>
    <select id="memberSelect" required></select>
    <button type="submit">Issue Book</button>
  </form>
  <h2>Currently Issued Books</h2>
  <table id="issuedTable">
    <thead><tr><th>Book</th><th>Member</th><th>Issue Date</th><th>Due Date</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="issuedBody"></tbody>
  </table>
</main>
<script src="/js/common.js"></script>
<script src="/js/transactions.js"></script>
</body>
</html>
