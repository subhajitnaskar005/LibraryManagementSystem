<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Members</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <h1>📚 Smart Library System</h1>
  <div class="nav-links">
    <a href="index.html">Dashboard</a>
    <a href="books.html">Books</a>
    <a href="members.html" class="active">Members</a>
    <a href="transactions.html">Issue / Return</a>
    <a href="waitlist.html">Waitlist</a>
  </div>
</nav>
<main>
  <h2>Manage Members</h2>
  <div id="message" class="message" style="display:none;"></div>
  <form id="memberForm" class="card-form">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="number" id="phone" placeholder="Phone">
    <button type="submit" id="submitBtn">Add Member</button>
    <button type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
  </form>
  <table id="membersTable">
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined On</th><th>Actions</th></tr></thead>
    <tbody id="membersBody"></tbody>
  </table>
</main>
<script src="js/common.js"></script>
<script src="js/members.js"></script>
</body>
</html>
